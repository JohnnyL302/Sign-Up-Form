<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up Form</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="sidebar">
    <div class="logo-background">
        <img src="images/Odin-logo.png" alt="Odin's logo">
        <div>ODIN</div>
     </div>
     <div class="credit">Photo by Halie West on Upslash</div>
    </div>
    
    
    <div class="right-side">
        <div class="top-part">
            <div class="heading-note">
                <h2>This is not a real online service! You know you need something <br>
                    like this in your life to help you realize your deepest dreams. <br>
                    Sign up <i>now</i> to get started.
                </h2>
                <br>
                <h2>You know <i>you</i> want to.</h2>
            </div>
        </div>
        <form action="">
        <h1>Let's do this!</h1>
        <div class="input-fields">
     
                <div>
                    <label for="first_name">FIRST NAME</label>
                    <input type="text" id="first_name" name="first_name" required>
                </div>
                <div>
                    <label for="last-name">LAST NAME</label>
                    <input type="text" id="last-name" name="last-name" required>
                </div>
                <div>
                    <label for="email">EMAIL</label>
                    <input type="email" id="email" name="email" required>
                </div>
                <div>
                    <label for="phone_number">PHONE NUMBER</label>
                    <input type="tel" id="phone_number" name="phone_number" required>
                </div>
                <div>
                    <label for="password">PASSWORD</label>
                    <input type="password" id="password" name="password" required>
                </div>
                <div>
                        <label for="confirm_password">CONFIRM PASSWORD</label>
                        <input type="password" id="confirm_password" name="confirm_password">
                </div>
        </div>
        <div class="bottom">
            <div class="button-class">
                <button>Create Account</button>
                <p>Already have an account? <a href="index.html"><b>Log in</b></a></p>
            </div>
        </div>
        </form>
    </div>

  
</body>
</html>
